[project]
name = "fraud-sequence-transformer"
version = "0.1.0"
description = "Card fraud detection from customer histories (TabFormer reproduced) with cost-based thresholds, served with a feature store"
readme = "README.md"
authors = [
    { name = "Juan Diego", email = "gaova777@utp.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
mlops = [
    "feast>=0.67.0",
    "prefect>=3.9.0",
]
